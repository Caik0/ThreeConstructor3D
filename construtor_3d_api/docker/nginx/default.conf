server {
    listen 80;
    server_name localhost;

    location /api/ {
        # A maioria das rotas é JSON pequeno; o upload de .glb (multipart, até 1 GB — ver
        # Formas.Modelo3dRequestTamanhoMaximo) é a exceção, então o limite daqui precisa cobrir ele
        client_max_body_size 1100m;
        # 1 GB numa conexão lenta demora — sem isso o nginx derruba a conexão no meio do upload
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Manda o corpo pro upstream conforme chega, em vez de bufferizar o upload inteiro aqui
        # antes de repassar (senão um .glb de 1 GB é bufferizado duas vezes: aqui e no Kestrel)
        proxy_request_buffering off;

        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://react:5173;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}